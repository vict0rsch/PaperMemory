<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PaperMemory store frame</title>
<!-- One store frame or video layer, described by a JSON object in the URL hash (see build.mjs).
     Geometry and styles are those of the approved step-7 mockups. -->
<link rel="stylesheet" href="../../public/tokens.css" />
<style>
* { box-sizing: border-box; }
html, body { margin: 0; background: transparent; }
.frame { position: relative; overflow: hidden; font-family: var(--pm-font); color: #1b2028; background: #fff; }
.frame img { display: block; }
.ic { display: block; }
/* drawn browser: 1280 x 720 = 60 (tab strip 28 + toolbar 32) + 660 page area */
.br { position: absolute; left: 0; width: 1280px; height: 720px; --c1: #dde1e7; --c2: #ffffff; --c3: #eef0f3; --ct: #1b2028; --ct2: #6f7886; --cb: #c9ced6; }
.br.dark { --c1: #17191d; --c2: #2a2d33; --c3: #1d2025; --ct: #e6e8ec; --ct2: #9aa2ae; --cb: #3a3e46; }
.br-tabs { position: absolute; inset: 0 0 auto 0; height: 28px; background: var(--c1); }
.br-dots { position: absolute; left: 14px; top: 10px; display: flex; gap: 7px; }
.br-dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--cb); }
.br-tab { position: absolute; left: 76px; top: 4px; height: 24px; width: 250px; padding: 0 12px; border-radius: 8px 8px 0 0; background: var(--c2); color: var(--ct); font-size: 11.5px; line-height: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.br-bar { position: absolute; inset: 28px 0 auto 0; height: 32px; background: var(--c2); border-bottom: 1px solid var(--cb); }
.br-nav { position: absolute; left: 16px; top: 7px; display: flex; gap: 14px; color: var(--ct2); }
.br-nav svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.br-url { position: absolute; left: 112px; right: 132px; top: 4px; height: 23px; border-radius: 12px; background: var(--c3); color: var(--ct2); font-size: 12px; line-height: 23px; padding: 0 14px; white-space: nowrap; overflow: hidden; }
.br-url b { color: var(--ct); font-weight: 400; }
.br-ext { position: absolute; right: 62px; top: 3px; width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; }
.br-ext.on { background: var(--c3); box-shadow: inset 0 0 0 1px var(--cb); }
.br-ext .ic { width: 18px; height: 18px; }
.br-more { position: absolute; right: 22px; top: 8px; display: flex; flex-direction: column; gap: 3px; }
.br-more i { width: 3px; height: 3px; border-radius: 50%; background: var(--ct2); }
.br-page { position: absolute; inset: 60px 0 0 0; background-color: #fff; background-repeat: no-repeat; }
.br.dark .br-page { background-color: #1e1f22; }
.br-popup { position: absolute; top: 61px; right: 12px; width: 450px; height: 600px; border-radius: 0 0 8px 8px; overflow: hidden; box-shadow: 0 0 0 1px rgba(27, 32, 40, 0.16), 0 14px 40px rgba(27, 32, 40, 0.28); }
.br-popup img { width: 450px; height: 600px; }
/* video caption: a 60 px band under the browser (the page area is then 600 px), one line */
.cap { position: absolute; inset: auto 0 0 0; height: 60px; padding: 0 40px; background: #1b2028; color: #fff; font-size: 26px; font-weight: 600; letter-spacing: -0.01em; line-height: 60px; white-space: nowrap; }
.br.h600 { height: 660px; overflow: hidden; }
/* title / end cards */
.card { position: absolute; inset: 0; background: #f3f4f6; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.card .ic { width: 112px; height: 112px; }
.card .nm { font-size: 64px; font-weight: 700; letter-spacing: -0.03em; margin-top: 22px; }
.card .vp { font-size: 28px; color: #4d5664; margin-top: 6px; }
.card .sm { font-size: 20px; color: #6f7886; margin-top: 26px; }
/* store screenshot: 80 px headline band + the 1280 x 720 browser */
.shot { width: 1280px; height: 800px; }
.shot .band { position: absolute; inset: 0 0 auto 0; height: 80px; background: #f3f4f6; display: flex; align-items: center; gap: 16px; padding: 0 32px; }
.shot .band .ic { width: 36px; height: 36px; flex: none; }
.shot .band h4 { margin: 0; font-size: 30px; font-weight: 650; letter-spacing: -0.02em; color: #1b2028; }
.shot.dark .band { background: #101215; }
.shot.dark .band h4 { color: #f0f2f5; }
.shot .br { top: 80px; }
.vid { width: 1280px; height: 720px; }
.vid .br { top: 0; }
/* promo tile 440 x 280 */
.tile { width: 440px; height: 280px; background: linear-gradient(160deg, #ffffff 0%, #e9ecf1 100%); }
.tile .tx { position: absolute; left: 26px; top: 34px; width: 210px; }
.tile .tx .ic { width: 52px; height: 52px; }
.tile .nm { font-size: 30px; font-weight: 700; letter-spacing: -0.03em; margin-top: 14px; line-height: 1.1; }
.tile .vp { font-size: 17px; font-weight: 500; color: #4d5664; line-height: 1.3; margin-top: 10px; }
.tile .ui { position: absolute; left: 242px; top: 54px; width: 180px; border-radius: 9px; box-shadow: 0 10px 30px rgba(27, 32, 40, 0.2); }
/* marquee 1400 x 560 */
.marq { width: 1400px; height: 560px; background: linear-gradient(160deg, #ffffff 0%, #e6e9ef 100%); }
.marq .tx { position: absolute; left: 96px; top: 118px; width: 640px; }
.marq .tx .ic { width: 84px; height: 84px; }
.marq .nm { font-size: 68px; font-weight: 700; letter-spacing: -0.035em; line-height: 1.05; margin-top: 22px; }
.marq .vp { font-size: 30px; font-weight: 500; color: #4d5664; line-height: 1.3; margin-top: 14px; }
.marq .sm { font-size: 18px; color: #6f7886; margin-top: 22px; }
.marq .pop { position: absolute; left: 860px; top: 56px; width: 450px; border-radius: 12px; box-shadow: 0 0 0 1px rgba(27, 32, 40, 0.1), 0 24px 60px rgba(27, 32, 40, 0.22); }
.marq .blk { position: absolute; left: 690px; top: 318px; width: 222px; border-radius: 9px; box-shadow: 0 16px 40px rgba(27, 32, 40, 0.26); }
/* video v2: the chapter band (number, headline, optional step with a keycap, progress ticks) */
.band { position: absolute; inset: auto 0 0 0; height: 60px; background: #1b2028; color: #fff; display: flex; align-items: center; padding: 0 40px; gap: 14.7px; white-space: nowrap; }
.band .n { width: 30.7px; height: 30.7px; border-radius: 50%; box-shadow: inset 0 0 0 1.33px #4d5664; color: #c3c9d2; font-size: 16px; font-weight: 650; display: grid; place-items: center; }
.band .t { font-size: 26px; font-weight: 650; letter-spacing: -0.01em; }
.band .s { margin-left: auto; font-size: 18.7px; color: #aab1bc; display: flex; align-items: center; gap: 8px; }
.key { display: inline-grid; place-items: center; min-width: 29.3px; height: 29.3px; padding: 0 8px; border-radius: 5.3px; box-shadow: inset 0 0 0 1.33px #6f7886, 0 2px 0 #4d5664; color: #fff; font-size: 16px; font-weight: 650; }
.ticks { display: flex; gap: 5.3px; margin-left: 18.7px; }
.ticks i { width: 22.7px; height: 3.3px; border-radius: 2px; background: #3a414c; }
.ticks i.on { background: #fff; }
/* chapter card: the band grown to full screen */
.chap { width: 1280px; height: 720px; background: #1b2028; color: #fff; padding: 0 120px; display: flex; flex-direction: column; justify-content: center; }
.chap .brand { position: absolute; left: 40px; top: 32px; display: flex; align-items: center; gap: 10.7px; font-size: 21.3px; font-weight: 650; letter-spacing: -0.02em; color: #c3c9d2; }
.chap .brand .ic { width: 32px; height: 32px; }
.chap .n { font-size: 20px; font-weight: 650; color: #8b94a1; letter-spacing: 0.04em; }
.chap h1 { margin: 12px 0 0; font-size: 85.3px; line-height: 1.04; font-weight: 700; letter-spacing: -0.04em; }
.chap p { margin: 20px 0 0; font-size: 29.3px; line-height: 1.3; color: #aab1bc; max-width: 933px; }
.chap .ticks { position: absolute; left: 120px; bottom: 64px; margin: 0; gap: 9.3px; }
.chap .ticks i { width: 73.3px; height: 4.7px; }
/* opening / end cards: light, with the mark */
.lite { width: 1280px; height: 720px; background: #f3f4f6; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #1b2028; }
.lite .brand { display: flex; align-items: center; gap: 13.3px; font-size: 34.7px; font-weight: 700; letter-spacing: -0.03em; }
.lite .brand .ic { width: 56px; height: 56px; }
.lite h1 { margin: 29.3px 0 0; font-size: 85.3px; line-height: 1.04; font-weight: 700; letter-spacing: -0.04em; }
.lite p { margin: 20px 0 0; font-size: 28px; color: #4d5664; }
.lite .big { width: 100px; height: 100px; }
.lite .nm { font-size: 64px; font-weight: 700; letter-spacing: -0.035em; margin-top: 17.3px; }
.lite .url { margin-top: 36px; font-size: 36px; font-weight: 650; letter-spacing: -0.02em; }
.lite .sm { margin-top: 12px; font-size: 20px; color: #6f7886; }
/* video framing A (slate): 1920 x 1080 backdrop, the window 1600 x 1000 at 160, 24 (a 1280 x 800
   browser drawn at 1.25), a chapter line under it; cards on the same backdrop */
.slate { width: 1920px; height: 1080px; color: #fff; background:
    radial-gradient(620px 460px at 0% 100%, rgba(198, 40, 40, 0.20), transparent 70%),
    radial-gradient(1300px 900px at 12% 0%, #3f527a 0%, transparent 62%),
    radial-gradient(1100px 800px at 100% 100%, #2f4170 0%, transparent 60%),
    #1b2028; }
.slate .win { position: absolute; left: 160px; top: 24px; width: 1280px; height: 800px; transform: scale(1.25); transform-origin: 0 0; overflow: hidden; border-radius: 11px; background: #fff; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.10), 0 24px 64px rgba(0, 0, 0, 0.50), 0 4px 12px rgba(0, 0, 0, 0.30); }
.slate .win .br { height: 800px; }
.slate .line { position: absolute; left: 160px; right: 160px; top: 1024px; height: 56px; display: flex; align-items: center; gap: 12px; white-space: nowrap; }
.slate .line .n { width: 30px; height: 30px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.35); color: #c3c9d2; font-size: 15px; font-weight: 650; display: grid; place-items: center; }
.slate .line .t { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; color: #e6e8ec; }
.slate .line .s { margin-left: auto; font-size: 20px; color: #aab1bc; display: flex; align-items: center; gap: 10px; }
.slate .line .key { min-width: 30px; height: 30px; padding: 0 9px; border-radius: 6px; box-shadow: inset 0 0 0 1.5px #6f7886, 0 2px 0 #4d5664; font-size: 16px; }
.slate .ticks { display: flex; gap: 8px; margin-left: 24px; }
.slate .ticks i { width: 34px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.22); }
.slate .ticks i.on { background: #fff; }
.slate .brand { position: absolute; left: 160px; top: 64px; display: flex; align-items: center; gap: 16px; font-size: 32px; font-weight: 650; letter-spacing: -0.02em; color: #c3c9d2; }
.slate .brand .ic { width: 48px; height: 48px; }
.slate .chap2 { position: absolute; inset: 0; padding: 0 160px; display: flex; flex-direction: column; justify-content: center; }
.slate .chap2 .k { font-size: 30px; font-weight: 650; color: #8b94a1; letter-spacing: 0.04em; }
.slate .chap2 h1 { margin: 18px 0 0; font-size: 128px; line-height: 1.04; font-weight: 700; letter-spacing: -0.04em; }
.slate .chap2 p { margin: 30px 0 0; font-size: 44px; line-height: 1.3; color: #aab1bc; }
.slate .chap2 .ticks { position: absolute; left: 160px; bottom: 96px; margin: 0; gap: 14px; }
.slate .chap2 .ticks i { width: 110px; height: 7px; border-radius: 3px; }
.slate .fin { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.slate .fin .ic { width: 150px; height: 150px; }
.slate .fin .nm { font-size: 96px; font-weight: 700; letter-spacing: -0.035em; margin-top: 26px; }
.slate .fin p { margin: 24px 0 0; font-size: 42px; color: #aab1bc; }
.slate .fin .url { margin-top: 54px; font-size: 54px; font-weight: 650; letter-spacing: -0.02em; }
.slate .fin .sm { margin-top: 18px; font-size: 30px; color: #8b94a1; }
/* the page area of a popup shot (CSS 1280 x 740): the page still and the popup's shadow */
.pa { position: relative; width: 1280px; height: 740px; background-size: 1280px auto; background-repeat: no-repeat; }
.pa .pop { position: absolute; top: 1px; right: 12px; width: 450px; height: 600px; border-radius: 0 0 8px 8px; box-shadow: 0 0 0 1px rgba(27, 32, 40, 0.16), 0 14px 40px rgba(27, 32, 40, 0.28); }
/* alpha masks: the window's page area (rounded bottom corners), the popup */
.wmask { width: 1600px; height: 925px; background: #000; }
.wmask div { width: 1600px; height: 925px; background: #fff; border-radius: 0 0 13.75px 13.75px; }
/* alpha mask of the popup (rounded bottom corners), for the video compositing */
.mask { width: 450px; height: 600px; background: #000; }
.mask div { width: 450px; height: 600px; background: #fff; border-radius: 0 0 8px 8px; }
</style>
</head>
<body>
<div id="out"></div>
<script>
const ICON = `<img class="ic" src="../../public/icons/icon-192.png" alt="">`;
const NAV = `<svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg><svg viewBox="0 0 16 16"><path d="m6 3 5 5-5 5"/></svg><svg viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.5M13 3v3h-3"/></svg>`;
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
// s: { tab, url (host, then path), dark, bg (page image, 1280 CSS px wide), by, popup (image | true: an
// empty box with its shadow, the recorded popup goes there) }
const browser = (s, h) => {
    const [host, ...rest] = s.url.split(" · ");
    const url = rest.length ? `<b>${esc(host)}</b> · ${esc(rest.join(" · "))}` : `<b>${esc(host.split("/")[0])}</b>${esc(host.slice(host.indexOf("/")))}`;
    const page = s.bg ? `background-image:url('${s.bg}');background-size:1280px auto;background-position:0 ${-(s.by || 0)}px` : "";
    const pop = s.popup === true ? `<div class="br-popup"></div>` : s.popup ? `<div class="br-popup"><img src="${s.popup}" alt=""></div>` : "";
    return `<div class="br${s.dark ? " dark" : ""}${h === 600 ? " h600" : ""}">
  <div class="br-tabs"><div class="br-dots"><i></i><i></i><i></i></div><div class="br-tab">${esc(s.tab)}</div></div>
  <div class="br-bar"><div class="br-nav">${NAV}</div><div class="br-url">${url}</div>
    <div class="br-ext${s.popup ? " on" : ""}">${ICON}</div><div class="br-more"><i></i><i></i><i></i></div></div>
  <div class="br-page" style="${page}"></div>${pop}
</div>`;
};
const card = (vp, sm) => `<div class="card">${ICON}<div class="nm">PaperMemory</div><div class="vp">${vp}</div>${sm ? `<div class="sm">${sm}</div>` : ""}</div>`;
const ticks = (n, of) => `<div class="ticks">${Array.from({ length: of }, (_, i) => `<i class="${i < n ? "on" : ""}"></i>`).join("")}</div>`;
// b: { n, of, t (headline), s (optional step), key (optional keycap) }
const band = (b) => `<div class="band"><span class="n">${b.n}</span><span class="t">${esc(b.t)}</span><span class="s">${b.s ? esc(b.s) : ""}${b.key ? `<span class="key">${esc(b.key)}</span>` : ""}</span>${ticks(b.n, b.of)}</div>`;
const f = JSON.parse(decodeURIComponent(location.hash.slice(1)));
const html = {
    shot: () => `<div class="frame shot${f.dark ? " dark" : ""}"><div class="band">${ICON}<h4>${esc(f.head)}</h4></div>${browser(f, 660)}</div>`,
    vid: () => `<div class="frame vid">${f.card ? card(f.card[0], f.card[1]) : browser(f, f.cap || f.band ? 600 : 660)}${f.cap ? `<div class="cap">${esc(f.cap)}</div>` : ""}${f.band ? band(f.band) : ""}</div>`,
    chap: () => `<div class="frame chap"><div class="brand">${ICON}PaperMemory</div><div class="n">${f.n} / ${f.of}</div><h1>${esc(f.h)}</h1><p>${esc(f.p)}</p>${ticks(f.n, f.of)}</div>`,
    open: () => `<div class="frame lite"><div class="brand">${ICON}PaperMemory</div><h1>${esc(f.h)}</h1><p>${esc(f.p)}</p></div>`,
    end: () => `<div class="frame lite">${ICON.replace('class="ic"', 'class="ic big"')}<div class="nm">PaperMemory</div><p>Free and open source.</p><div class="url">papermemory.org</div><div class="sm">Chrome · Firefox · Edge · Brave</div></div>`,
    tile: () => `<div class="frame tile"><div class="tx">${ICON}<div class="nm">PaperMemory</div><div class="vp">Saves the papers<br>you read.</div></div><img class="ui" src="${f.block}" alt=""></div>`,
    marq: () => `<div class="frame marq"><div class="tx">${ICON}<div class="nm">PaperMemory</div><div class="vp">Saves the papers you read.<br>Search, tag and cite them.</div><div class="sm">arXiv · OpenReview · ACL · Nature · and more</div></div><img class="pop" src="${f.popup}" alt=""><img class="blk" src="${f.block}" alt=""></div>`,
    mask: () => `<div class="mask"><div></div></div>`,
    wmask: () => `<div class="wmask"><div></div></div>`,
    pagearea: () => `<div class="pa" style="background-image:url('${f.bg}')"><div class="pop"></div></div>`,
    // f: { tab, url, popup, line: { n, of, t, s, key } }
    slate: () => `<div class="frame slate"><div class="win">${browser(f, 740)}</div>${f.line ? `<div class="line"><span class="n">${f.line.n}</span><span class="t">${esc(f.line.t)}</span><span class="s">${f.line.s ? esc(f.line.s) : ""}${f.line.key ? `<span class="key">${esc(f.line.key)}</span>` : ""}</span>${ticks(f.line.n, f.line.of)}</div>` : ""}</div>`,
    slatechap: () => `<div class="frame slate"><div class="brand">${ICON}PaperMemory</div><div class="chap2"><div class="k">${f.n} / ${f.of}</div><h1>${esc(f.h)}</h1><p>${esc(f.p)}</p>${ticks(f.n, f.of)}</div></div>`,
    slateopen: () => `<div class="frame slate"><div class="brand">${ICON}PaperMemory</div><div class="chap2"><h1>${esc(f.h)}</h1><p>${esc(f.p)}</p></div></div>`,
    slateend: () => `<div class="frame slate"><div class="fin">${ICON}<div class="nm">PaperMemory</div><p>Free and open source.</p><div class="url">papermemory.org</div><div class="sm">Chrome · Firefox · Edge · Brave</div></div></div>`,
}[f.t]();
document.getElementById("out").innerHTML = html;
</script>
</body>
</html>
