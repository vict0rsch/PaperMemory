<div id="menu-container" style="display: none">
    <div class="pm-menu-body" id="menu-body" tabindex="-1">
        <p class="pm-menu-links-label">Open in a new tab</p>
        <div class="pm-menu-links">
            <button
                class="pm-btn"
                id="full-memory"
                title="Open the full-page Memory in a new tab"
            >
                <i data-i="list"></i>Full Memory<i data-i="open" class="pm-ext"></i>
            </button>
            <button class="pm-btn" id="bib-matcher" title="Open BibMatcher in a new tab">
                <i data-i="swap"></i>BibMatcher<i data-i="open" class="pm-ext"></i>
            </button>
            <button
                class="pm-btn"
                id="advanced-configuration"
                title="Open the options page in a new tab"
            >
                <i data-i="sliders"></i>All options<i data-i="open" class="pm-ext"></i>
            </button>
        </div>

        <p class="pm-section-title pm-menu-label">Most used</p>
        <div class="pm-menu-group">
            <div class="pm-row">
                <div class="pm-row-text"><div class="pm-row-label">Theme</div></div>
                <div class="pm-seg" role="group" aria-label="Theme" id="theme-select">
                    <button data-value="system">System</button>
                    <button data-value="light">Light</button>
                    <button data-value="dark">Dark</button>
                </div>
            </div>
            <label class="pm-row">
                <span class="pm-row-text">
                    <span class="pm-row-label">Record papers automatically</span>
                    <span class="pm-row-help">Off: add a paper from the popup yourself.</span>
                </span>
                <!-- checkNoAuto is stored inverted: checked here = checkNoAuto false -->
                <input type="checkbox" class="pm-toggle" id="checkNoAuto" data-invert />
            </label>
            <label class="pm-row">
                <span class="pm-row-text">
                    <span class="pm-row-label"
                        >Open on Memory when the page is not a paper</span
                    >
                </span>
                <input type="checkbox" class="pm-toggle" id="checkDirectOpen" />
            </label>
            <label class="pm-row">
                <span class="pm-row-text">
                    <span class="pm-row-label"
                        >Keep search and filters when leaving the Memory</span
                    >
                    <span class="pm-row-help"
                        >Until the popup closes. Otherwise they are cleared.</span
                    >
                </span>
                <input type="checkbox" class="pm-toggle" id="checkKeepMemorySearch" />
            </label>
            <label class="pm-row">
                <span class="pm-row-text">
                    <span class="pm-row-label">Show a notice when a paper is saved</span>
                </span>
                <input type="checkbox" class="pm-toggle" id="checkFeedback" />
            </label>
            <div class="pm-row">
                <div class="pm-row-text">
                    <label class="pm-row-label" for="memory-item-default-action"
                        ><span class="pm-kbd">↵</span> on a paper</label
                    >
                </div>
                <select class="pm-select" id="memory-item-default-action">
                    <option value="e">Edit tags &amp; note</option>
                    <option value="d">Show details</option>
                    <option value="o">Open paper</option>
                    <option value="c">Copy URL</option>
                    <option value="m">Copy Markdown</option>
                    <option value="b">Copy BibTeX</option>
                    <option value="h">Copy rich link</option>
                    <option value="5">Open on ar5iv</option>
                    <option value="x">Open on alphaXiv</option>
                    <option value="f">Open on Hugging Face</option>
                    <option value="s">Open on SciRate</option>
                </select>
            </div>
        </div>

        <p class="pm-section-title pm-menu-label pm-menu-label-more">More</p>
        <div class="pm-menu-group pm-menu-more">
            <details>
                <summary>
                    <span class="pm-gicon"><i data-i="link"></i></span>Links &amp; copying
                    <span class="pm-spacer"></span><small>3 settings</small
                    ><i data-i="down" class="pm-i-sm pm-caret-i"></i>
                </summary>
                <label class="pm-row">
                    <span class="pm-row-text">
                        <span class="pm-row-label">Prefer PDF links</span>
                        <span class="pm-row-help"
                            >Otherwise links point to the abstract page.</span
                        >
                    </span>
                    <input type="checkbox" class="pm-toggle" id="checkPreferPdf" />
                </label>
                <label class="pm-row">
                    <span class="pm-row-text">
                        <span class="pm-row-label"
                            >Add venue and year to Markdown links</span
                        >
                    </span>
                    <input type="checkbox" class="pm-toggle" id="checkMdYearVenue" />
                </label>
                <label class="pm-row">
                    <span class="pm-row-text">
                        <span class="pm-row-label"
                            >Open the downloaded PDF when there is one</span
                        >
                        <span class="pm-row-help"
                            >Applies to <span class="pm-kbd">o</span> in the Memory.</span
                        >
                    </span>
                    <input type="checkbox" class="pm-toggle" id="checkEnterLocalPdf" />
                </label>
            </details>
            <details>
                <summary>
                    <span class="pm-gicon"><i data-i="doc"></i></span>Recording
                    <span class="pm-spacer"></span><small>3 settings</small
                    ><i data-i="down" class="pm-i-sm pm-caret-i"></i>
                </summary>
                <label class="pm-row">
                    <span class="pm-row-text">
                        <span class="pm-row-label">Only record from PDF pages</span>
                        <span class="pm-row-help">Ignore abstract pages.</span>
                    </span>
                    <input type="checkbox" class="pm-toggle" id="checkPdfOnly" />
                </label>
                <label class="pm-row">
                    <span class="pm-row-text">
                        <span class="pm-row-label"
                            >Keep PDFs in Downloads/PaperMemoryStore</span
                        >
                        <span class="pm-row-help"
                            >Reopen a file instead of downloading it again.</span
                        >
                    </span>
                    <input type="checkbox" class="pm-toggle" id="checkStore" />
                </label>
                <label class="pm-row">
                    <span class="pm-row-text">
                        <span class="pm-row-label"
                            >Parse any website
                            <span class="pm-badge pm-badge-warn">Experimental</span></span
                        >
                        <span class="pm-row-help"
                            >Adds a “Parse this page” button to the popup.</span
                        >
                    </span>
                    <input type="checkbox" class="pm-toggle" id="checkWebsiteParsing" />
                </label>
            </details>
            <details>
                <summary>
                    <span class="pm-gicon"><i data-i="open"></i></span>Extra links in the
                    popup <span class="pm-spacer"></span><small>4 settings</small
                    ><i data-i="down" class="pm-i-sm pm-caret-i"></i>
                </summary>
                <label class="pm-row">
                    <span class="pm-row-text">
                        <span class="pm-row-label">ar5iv <span class="pm-kbd">5</span></span>
                    </span>
                    <input type="checkbox" class="pm-toggle" id="checkAr5iv" />
                </label>
                <label class="pm-row">
                    <span class="pm-row-text">
                        <span class="pm-row-label"
                            >alphaXiv <span class="pm-kbd">x</span></span
                        >
                    </span>
                    <input type="checkbox" class="pm-toggle" id="checkAlphaxiv" />
                </label>
                <label class="pm-row">
                    <span class="pm-row-text">
                        <span class="pm-row-label"
                            >Hugging Face papers <span class="pm-kbd">f</span></span
                        >
                        <span class="pm-row-help">arXiv papers only.</span>
                    </span>
                    <input type="checkbox" class="pm-toggle" id="checkHuggingface" />
                </label>
                <label class="pm-row">
                    <span class="pm-row-text">
                        <span class="pm-row-label"
                            >SciRate <span class="pm-kbd">s</span></span
                        >
                    </span>
                    <input type="checkbox" class="pm-toggle" id="checkScirate" />
                </label>
            </details>
            <details>
                <summary>
                    <span class="pm-gicon"><i data-i="globe"></i></span>On paper pages
                    <span class="pm-spacer"></span><small>4 settings</small
                    ><i data-i="down" class="pm-i-sm pm-caret-i"></i>
                </summary>
                <label class="pm-row">
                    <span class="pm-row-text">
                        <span class="pm-row-label"
                            >Rename paper tabs with the paper title</span
                        >
                    </span>
                    <input type="checkbox" class="pm-toggle" id="checkPdfTitle" />
                </label>
                <label class="pm-row">
                    <span class="pm-row-text">
                        <span class="pm-row-label"
                            >arXiv: direct PDF download button</span
                        >
                    </span>
                    <input type="checkbox" class="pm-toggle" id="checkDownload" />
                </label>
                <label class="pm-row">
                    <span class="pm-row-text">
                        <span class="pm-row-label">arXiv: Markdown link section</span>
                    </span>
                    <input type="checkbox" class="pm-toggle" id="checkMd" />
                </label>
                <label class="pm-row">
                    <span class="pm-row-text">
                        <span class="pm-row-label">arXiv: BibTeX section</span>
                    </span>
                    <input type="checkbox" class="pm-toggle" id="checkBib" />
                </label>
            </details>
        </div>
    </div>
    <footer class="pm-hints">
        <span><span class="pm-kbd">p</span> Close</span>
        <span class="pm-spacer"></span>
        <a
            class="link-in-new-tab"
            href="https://papermemory.org/getting-started/"
            title="User guide (new tab)"
            >Guide</a
        >
        <a class="link-in-new-tab" href="https://papermemory.org" title="Documentation (new tab)"
            >Docs</a
        >
        <a
            class="link-in-new-tab"
            href="https://github.com/vict0rsch/PaperMemory/issues"
            title="Report a problem or suggest an idea (new tab)"
            >Feedback</a
        >
        <span class="pm-version">v<span id="pm-version"></span></span>
    </footer>
</div>
