<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>PaperMemory Memory</title>
        <link rel="stylesheet" type="text/css" href="/tokens.css" wxt-ignore />
        <link rel="stylesheet" type="text/css" href="/components.css" wxt-ignore />
        <link rel="stylesheet" type="text/css" href="/popup.css" wxt-ignore />
        <link rel="stylesheet" type="text/css" href="/options-page.css" wxt-ignore />
        <link rel="stylesheet" type="text/css" href="/fullMemory-page.css" wxt-ignore />
        <!-- after every stylesheet: applies the theme before first paint -->
        <script src="/theme.js"></script>

        <script type="module" src="./main.js"></script>
    </head>

    <!-- design-review/v2-addenda/step5-fullmemory.html. 1200px and wider: tag sidebar, table,
         detail pane; 900 to 1200px: the pane is a drawer; below 900px: the popup's rows
         (#memory-table). The search field, pills, sort menu and tag list are the popup's
         (same ids: popup/js/memory.js drives them). -->
    <body class="pm-ui" id="pm-fullmemory" data-pane="closed">
        <!--=include ../../shared/html/topbar.html -->

        <div class="m-app">
            <!-- ============ tag sidebar (900px and wider) ============ -->
            <aside class="m-side" aria-label="Library and tags">
                <nav class="o-nav" aria-label="Library">
                    <a href="#" id="m-all"
                        ><i data-i="list"></i><span>All papers</span
                        ><span class="pm-count" id="memory-count"></span
                    ></a>
                    <a href="#" id="m-favs"
                        ><i data-i="star" class="m-fav"></i><span>Favourites</span
                        ><span class="pm-count" id="m-fav-count"></span
                    ></a>
                </nav>

                <div class="pm-label-caps">
                    Tags <span class="pm-count" id="m-tag-count"></span>
                </div>
                <label class="pm-field m-tagfilter">
                    <i data-i="search"></i>
                    <input
                        type="text"
                        id="m-tag-filter"
                        placeholder="Filter tags"
                        aria-label="Filter tags"
                        autocomplete="off"
                        spellcheck="false"
                    />
                </label>
                <div id="m-taglist" role="group" aria-label="Tags"></div>

                <div class="m-side-foot">
                    <a class="o-linkbtn" href="/options.html#tag-manager"
                        >Rename or merge tags in Settings</a
                    >
                    <div class="o-side-status m-sync" id="m-sync" role="status" hidden>
                        <span class="pm-dot"></span><span class="m-sync-text"></span
                        ><a href="/options.html#sync" class="m-sync-link" hidden
                            >Sync settings</a
                        >
                    </div>
                </div>
            </aside>

            <!-- ============ list ============ -->
            <main class="m-main" id="memory-container">
                <div class="m-searchwrap" id="memory-filters">
                    <div class="m-searchfield">
                        <div class="pm-field pm-mv-search" id="memory-search-field">
                            <i data-i="search"></i>
                            <input
                                id="memory-search"
                                type="text"
                                placeholder="Search, or t: c: y: filters"
                                autocomplete="off"
                                spellcheck="false"
                                aria-label="Search your Memory"
                            />
                            <!-- shown when there is text or a pill: clears both -->
                            <button
                                type="button"
                                class="pm-quiet pm-ic pm-search-x"
                                id="memory-search-x"
                                tabindex="-1"
                                aria-label="Clear search"
                                data-tip="Clear search"
                                hidden
                            >
                                <i data-i="x"></i>
                            </button>
                            <span class="pm-count" id="memory-result-count"></span>
                            <span class="pm-mv-sep"></span>
                            <!-- below 900px only: the sidebar has the tags and favourites -->
                            <button
                                type="button"
                                class="pm-quiet pm-ic m-only-narrow"
                                id="memory-tags-button"
                                tabindex="-1"
                                aria-label="Browse tags"
                                data-tip="Browse tags"
                                aria-expanded="false"
                            >
                                <i data-i="tag"></i>
                            </button>
                            <button
                                type="button"
                                class="pm-quiet pm-ic m-only-narrow"
                                id="filter-favorites"
                                tabindex="-1"
                                aria-label="Favourites only"
                                data-tip="Favourites only"
                                aria-pressed="false"
                            >
                                <i data-i="star"></i>
                            </button>
                            <button
                                type="button"
                                class="pm-quiet pm-ic"
                                id="memory-sort-button"
                                tabindex="-1"
                                aria-label="Sort: last opened, newest first"
                                data-tip="Sort: last opened, newest first"
                                aria-haspopup="menu"
                                aria-expanded="false"
                            >
                                <i data-i="swap"></i>
                            </button>
                        </div>
                        <div
                            class="pm-sugg pm-mv-sugg"
                            id="memory-tag-suggestions"
                            role="listbox"
                            hidden
                        ></div>
                        <div
                            class="pm-sugg pm-sortmenu"
                            id="memory-sort-menu"
                            role="menu"
                            hidden
                        ></div>
                    </div>
                    <div class="m-pillline">
                        <div class="pm-pillrow" id="memory-pills" hidden></div>
                        <span
                            class="m-sync-narrow"
                            id="m-sync-narrow"
                            role="status"
                            hidden
                            ><span class="pm-dot"></span
                            ><span class="m-sync-text"></span
                        ></span>
                    </div>
                    <div class="pm-sugg pm-tagpanel" id="memory-tag-panel" hidden></div>
                </div>

                <!-- 900px and wider: the sortable table -->
                <div class="o-card m-tablecard" id="m-tablecard">
                    <table class="m-table" aria-label="Your Memory">
                        <thead>
                            <tr>
                                <th class="c-check">
                                    <input
                                        type="checkbox"
                                        class="pm-check"
                                        id="m-select-all"
                                        tabindex="-1"
                                        aria-label="Select all papers"
                                        data-tip="Select all papers"
                                    />
                                </th>
                                <th class="c-fav"></th>
                                <th class="c-paper">
                                    <button
                                        type="button"
                                        class="m-sort"
                                        data-sort="title"
                                    >
                                        Paper <i data-i="down"></i>
                                    </button>
                                </th>
                                <th class="c-venue">
                                    <span class="pm-label-caps">Venue</span>
                                </th>
                                <th class="c-year">
                                    <button
                                        type="button"
                                        class="m-sort"
                                        data-sort="year"
                                    >
                                        Year <i data-i="down"></i>
                                    </button>
                                </th>
                                <th class="c-tags">
                                    <span class="pm-label-caps">Tags</span>
                                </th>
                                <th class="c-open c-num">
                                    <button
                                        type="button"
                                        class="m-sort"
                                        data-sort="lastOpenDate"
                                    >
                                        Opened <i data-i="down"></i>
                                    </button>
                                </th>
                                <th class="c-visits c-num">
                                    <button
                                        type="button"
                                        class="m-sort"
                                        data-sort="count"
                                    >
                                        Visits <i data-i="down"></i>
                                    </button>
                                </th>
                                <th class="c-info"></th>
                            </tr>
                        </thead>
                        <tbody id="m-tbody"></tbody>
                    </table>
                    <div id="m-empty" hidden></div>
                </div>
                <!-- 900px and wider: sticky footer, the bulk actions (only while papers are
                     selected) over the key hints -->
                <div class="m-foot" id="m-foot">
                    <div class="m-bulk" id="m-bulk" role="toolbar" hidden>
                        <b id="m-bulk-count"></b>
                        <button
                            type="button"
                            class="pm-btn pm-btn-ghost pm-btn-sm"
                            data-bulk="tag"
                        >
                            <i data-i="tag"></i>Add tag…
                        </button>
                        <button
                            type="button"
                            class="pm-btn pm-btn-ghost pm-btn-sm"
                            data-bulk="fav"
                        >
                            <i data-i="star"></i>Favourite
                        </button>
                        <button
                            type="button"
                            class="pm-btn pm-btn-ghost pm-btn-sm"
                            data-bulk="copy"
                        >
                            <i data-i="bib"></i>Copy BibTeX
                        </button>
                        <button
                            type="button"
                            class="pm-btn pm-btn-ghost pm-btn-sm"
                            data-bulk="export"
                        >
                            <i data-i="download"></i>Export .bib
                        </button>
                        <span class="pm-mv-sep"></span>
                        <button
                            type="button"
                            class="pm-btn pm-btn-ghost pm-btn-sm m-danger"
                            data-bulk="delete"
                        >
                            <i data-i="trash"></i>Delete…
                        </button>
                        <span class="pm-mv-sep"></span>
                        <button
                            type="button"
                            class="pm-iconbtn m-bulk-x"
                            data-bulk="clear"
                            aria-label="Clear the selection"
                            data-tip="Clear the selection"
                        >
                            <i data-i="x" class="pm-i-sm"></i>
                        </button>
                    </div>
                    <div class="m-tablefoot" id="m-tablefoot">
                        <span><span class="pm-kbd">tab</span> next paper</span>
                        <span class="m-hint-d"
                            ><span class="pm-kbd">d</span> details</span
                        >
                        <span><span class="pm-kbd">+</span> all authors</span>
                        <span><span class="pm-kbd">space</span> select</span>
                        <i class="m-break"></i>
                        <span><span class="pm-kbd">/</span> search</span>
                        <span><span class="pm-kbd">↵</span> open</span>
                        <span
                            ><span class="pm-kbd">o</span><span class="pm-kbd">c</span
                            ><span class="pm-kbd">h</span><span class="pm-kbd">m</span
                            ><span class="pm-kbd">b</span> open and copy</span
                        >
                        <span
                            ><span class="pm-kbd">5</span><span class="pm-kbd">x</span
                            ><span class="pm-kbd">f</span
                            ><span class="pm-kbd">s</span> open elsewhere</span
                        >
                        <span><span class="pm-kbd">e</span> edit</span>
                        <span><span class="pm-kbd">⌫</span> delete</span>
                    </div>
                </div>

                <!-- below 900px: the popup's rows -->
                <div class="o-card m-rows-wrap">
                    <div id="memory-table"></div>
                </div>
            </main>

            <!-- ============ detail pane: the current paper (a drawer from 900 to 1200px) ============ -->
            <aside class="m-detail" id="m-detail" aria-label="Paper details"></aside>
        </div>

        <!-- confirmations (src/options/dialog.js) -->
        <dialog class="o-dialog" id="o-dialog" aria-labelledby="o-dialog-title">
            <form method="dialog">
                <h2 id="o-dialog-title"></h2>
                <div class="o-dialog-body" id="o-dialog-body"></div>
                <div class="o-dialog-foot" id="o-dialog-foot"></div>
            </form>
        </dialog>

        <!-- copy feedback (popup.js showToast) -->
        <div id="popup-feedback-copied" class="pm-ptoast" role="status" hidden>
            <i data-i="check" class="pm-i-sm"></i><span></span>
        </div>
    </body>
</html>
