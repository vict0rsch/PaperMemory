<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />

        <link
            rel="stylesheet"
            type="text/css"
            href="/bootstrap-utilities.min.css"
            wxt-ignore
        />
        <link rel="stylesheet" type="text/css" href="/tokens.css" wxt-ignore />
        <link rel="stylesheet" type="text/css" href="/components.css" wxt-ignore />
        <link rel="stylesheet" type="text/css" href="/vars.css" wxt-ignore />
        <link rel="stylesheet" type="text/css" href="/popup.css" wxt-ignore />
        <!-- after every stylesheet: applies the theme before first paint -->
        <script src="/theme.js"></script>

        <script type="module" src="./main.js"></script>
    </head>

    <body id="pm-popup">
        <!-- the restyled popup (.pm-ui): header, Paper view / Memory list, sheets -->
        <div id="pm-shell" class="pm-ui">
            <header class="pm-hdr" id="popup-header">
                <span class="pm-brand"><i data-i="mark"></i>PaperMemory</span>
                <nav class="pm-tabs" role="tablist" aria-label="Views">
                    <button
                        class="pm-tab"
                        id="tab-paper"
                        role="tab"
                        aria-selected="true"
                        aria-label="Paper: this page"
                    >
                        Paper
                    </button>
                    <button
                        class="pm-tab"
                        id="tab-memory"
                        role="tab"
                        aria-selected="false"
                        aria-keyshortcuts="a"
                    >
                        Memory <span class="pm-count" id="memory-count"></span>
                    </button>
                </nav>
                <span class="pm-spacer"></span>
                <div id="sync-popup-feedback" style="display: none">
                    <div id="sync-popup-syncing" style="display: none">
                        <span class="pm-sync"
                            ><span class="pm-spinner"></span>Syncing</span
                        >
                    </div>
                    <div id="sync-popup-synced" style="display: none">
                        <span class="pm-sync pm-sync-ok"
                            ><i data-i="check"></i>Synced</span
                        >
                    </div>
                    <a
                        href="#"
                        id="sync-popup-error"
                        style="display: none"
                        class="pm-out"
                        aria-label="Sync failed: open the sync settings"
                        data-tip="Open the sync settings in a new tab"
                        ><span class="pm-sync pm-sync-err"
                            ><i data-i="alert"></i>Sync failed</span
                        ></a
                    >
                </div>
                <button
                    id="menu-switch"
                    class="pm-iconbtn"
                    aria-label="Settings (p)"
                    data-tip="Settings"
                    data-tip-key="p"
                    aria-expanded="false"
                >
                    <i data-i="gear"></i>
                </button>
            </header>

            <!-- the agents waiting for the user's OK (Agent access), in both views -->
            <div id="popup-pairing-slot"></div>

            <main id="popup-body">
                <div id="popup-notice-slot"></div>
                <div id="popup-loading" class="pm-empty">
                    <span class="pm-spinner pm-spinner-lg"></span>
                    <p>Opening your Memory…</p>
                </div>
                <div id="notArxiv" style="display: none"></div>
                <div id="isArxiv" style="display: none"></div>
            </main>

            <!-- Memory tab. The tab header
                 scrolls away with the list (#pm-shell.pm-mv-scrolled) and comes back on a
                 wheel / touch scroll-up; the search field stays. -->
            <div id="memory-container" class="pm-mv" style="display: none">
                <div class="pm-mv-tools" id="memory-filters">
                    <div class="pm-field pm-mv-search" id="memory-search-field">
                        <i data-i="search"></i>
                        <button
                            type="button"
                            class="pm-chip pm-chip-filter pm-fchip"
                            id="memory-filter-chip"
                            tabindex="-1"
                            hidden
                        ></button>
                        <input
                            id="memory-search"
                            type="text"
                            placeholder="Search, or t: c: y: filters"
                            autocomplete="off"
                            spellcheck="false"
                            aria-label="Search your Memory"
                        />
                        <!-- shown when there is text or a pill: clears both -->
                        <button
                            type="button"
                            class="pm-quiet pm-ic pm-search-x"
                            id="memory-search-x"
                            tabindex="-1"
                            aria-label="Clear search"
                            data-tip="Clear search"
                            hidden
                        >
                            <i data-i="x"></i>
                        </button>
                        <span class="pm-count" id="memory-result-count"></span>
                        <span class="pm-mv-sep"></span>
                        <button
                            type="button"
                            class="pm-quiet pm-ic"
                            id="memory-tags-button"
                            tabindex="-1"
                            aria-label="Browse tags"
                            data-tip="Browse tags"
                            aria-expanded="false"
                        >
                            <i data-i="tag"></i>
                        </button>
                        <button
                            type="button"
                            class="pm-quiet pm-ic"
                            id="filter-favorites"
                            tabindex="-1"
                            aria-label="Favourites only"
                            data-tip="Favourites only"
                            aria-pressed="false"
                        >
                            <i data-i="star"></i>
                        </button>
                        <button
                            type="button"
                            class="pm-quiet pm-ic"
                            id="memory-sort-button"
                            tabindex="-1"
                            aria-label="Sort: last opened, newest first"
                            data-tip="Sort: last opened, newest first"
                            aria-haspopup="menu"
                            aria-expanded="false"
                        >
                            <i data-i="swap"></i>
                        </button>
                    </div>
                    <div class="pm-sugg pm-mv-sugg" id="memory-tag-suggestions" role="listbox" hidden></div>
                    <div class="pm-sugg pm-sortmenu" id="memory-sort-menu" role="menu" hidden></div>
                </div>
                <div class="pm-pillrow" id="memory-pills" hidden></div>
                <div class="pm-sugg pm-tagpanel" id="memory-tag-panel" hidden></div>
                <div class="pm-mv-list" id="memory-scroll">
                    <div id="memory-table"></div>
                </div>
            </div>

            <footer class="pm-hints" id="popup-hints">
                <span class="pm-hint-nav"><span class="pm-kbd">a</span> Memory</span>
                <span class="pm-hint-nav"><span class="pm-kbd">p</span> Settings</span>
                <span class="pm-spacer"></span>
                <span><span class="pm-kbd">?</span> All shortcuts</span>
            </footer>

            <!--=include menu.html -->

            <div class="pm-sheet-layer" id="popup-modal-wrapper" style="display: none">
                <div class="pm-scrim" id="popup-modal-scrim"></div>
                <!--=include modals/*.html -->
            </div>

            <div class="pm-sheet-layer" id="delete-paper-modal" style="display: none">
                <div class="pm-scrim" id="delete-paper-modal-scrim"></div>
                <div
                    class="pm-sheet"
                    role="dialog"
                    tabindex="-1"
                    aria-labelledby="delete-modal-heading"
                >
                    <div class="pm-sheet-head">
                        <h2 id="delete-modal-heading">Delete this paper?</h2>
                    </div>
                    <div class="pm-sheet-body">
                        <div class="pm-quote" id="delete-modal-title"></div>
                        <p>
                            Its tags, note and code link are deleted with it. Opening the
                            paper again adds it back, without them.
                        </p>
                    </div>
                    <div class="pm-sheet-actions">
                        <button class="pm-btn" id="delete-paper-modal-cancel-button">
                            Cancel
                        </button>
                        <button
                            class="pm-btn pm-btn-danger-solid"
                            id="delete-paper-modal-confirm-button"
                        >
                            Delete <span class="pm-kbd">↵</span>
                        </button>
                    </div>
                    <span id="delete-paper-modal-hidden-id" style="display: none"></span>
                </div>
            </div>

            <div id="popup-feedback-copied" class="pm-ptoast" role="status" hidden>
                <i data-i="check" class="pm-i-sm"></i><span></span>
            </div>
        </div>

    </body>
</html>
