<!-- Sources picker (src/shared/js/sourcePicker.js), in the body of a card: options page
     (Capture & sources) and welcome page. Included by path ../../shared/html/source-picker.html
     (relative to src/popup/html). -->
<div class="o-toolbar">
    <label class="pm-field o-filter">
        <i data-i="search"></i>
        <input
            type="search"
            id="sources-filter"
            placeholder="Filter sources"
            aria-label="Filter sources"
            autocomplete="off"
        />
    </label>
    <span class="o-muted" id="sources-count" aria-live="polite"></span>
    <span class="pm-spacer"></span>
    <button type="button" class="pm-btn pm-btn-ghost pm-btn-sm" id="sources-all-on">
        Turn all on
    </button>
    <button type="button" class="pm-btn pm-btn-ghost pm-btn-sm" id="sources-all-off">
        Turn all off
    </button>
</div>
<div class="o-cells" id="select-sources-container"></div>
<p class="o-muted o-none" id="sources-none" hidden>No source matches.</p>
<div class="o-btns o-sources-foot">
    <button
        type="button"
        class="pm-btn pm-btn-ghost pm-btn-sm"
        id="sources-show-all"
        aria-expanded="false"
    >
        <span></span><i data-i="down" class="pm-i-sm"></i>
    </button>
    <span class="pm-spacer"></span>
    <a
        class="pm-out o-link-sm"
        href="https://github.com/vict0rsch/PaperMemory/issues/13"
        target="_blank"
        rel="noopener noreferrer"
        data-tip="Request a source on GitHub"
        >Request a source</a
    >
</div>
